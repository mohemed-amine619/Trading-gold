# ─────────────────────────────────────────────────────────────────────────────
# Ubuntu core stack: application + PostgreSQL.
#
# This stack does NOT contain MetaTrader5. The MT5 terminal and its bridge run
# on the Windows VM and are reached over HTTP via MT5_BRIDGE_URL.
#
#   docker compose up -d --build     start (first run migrates the schema)
#   docker compose ps                status + health
#   docker compose logs -f app       application logs
#   docker compose down              stop, KEEPING data (named volume)
#   docker compose down -v           stop and DELETE the database volume
#
# NEVER run `down -v` against a database you intend to keep — it destroys
# all trading history. See docs/DATABASE_BACKUP_RESTORE.md.
# ─────────────────────────────────────────────────────────────────────────────

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-trading}
      # Deterministic collation so index ordering is stable across hosts.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Bound to loopback only: PostgreSQL is not reachable from the network.
    # The app reaches it over the private compose network via `db:5432`.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # Readiness gate: the app waits for this before starting, so it never
      # crash-loops against a database that is still initialising.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading} -d ${POSTGRES_DB:-trading}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - trading_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Compose interpolates ${...} from the host environment or .env file.
      # The password is injected at runtime and never baked into the image.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-trading}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-trading}
      TRADING_MODE: ${TRADING_MODE:-paper}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Windows MT5 bridge (optional — leave empty to run with no broker).
      MT5_BRIDGE_URL: ${MT5_BRIDGE_URL:-}
      MT5_BRIDGE_TOKEN: ${MT5_BRIDGE_TOKEN:-}
      MT5_BRIDGE_TIMEOUT_SECONDS: ${MT5_BRIDGE_TIMEOUT_SECONDS:-10}
      MT5_BRIDGE_TLS_VERIFY: ${MT5_BRIDGE_TLS_VERIFY:-true}
    # Published on loopback only. Use a reverse proxy or TLS before exposing
    # this beyond the host.
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    healthcheck:
      # Readiness, not liveness: fails until PostgreSQL is reachable.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # SIGTERM then SIGKILL. uvicorn drains in-flight requests on SIGTERM.
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - trading_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  pgdata:
    name: trading_pgdata

networks:
  trading_net:
    name: trading_net
    driver: bridge